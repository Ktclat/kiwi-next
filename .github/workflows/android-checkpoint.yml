name: Kiwi Android cached APK build

on:
  push:
    branches: [test/android-checkpoint]
    paths: ['.github/workflows/android-checkpoint.yml', 'tools/compare_ninja_progress.py']

permissions:
  contents: read
  actions: read

concurrency:
  group: kiwi-android-checkpoint
  cancel-in-progress: false

env:
  DEPOT_TOOLS_UPDATE: '0'
  DEPOT_TOOLS_REVISION: ac31fc680158b9ad57e4020e53943a6abd85fcd7
  ORIGINAL_CACHE: kiwi-apk-extended-v1-46093054194-1
  CHAIN_CACHE: kiwi-apk-extended-v1-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  package:
    if: github.repository == 'Ktclat/kiwi-next' && github.ref == 'refs/heads/test/android-checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check capacity on a disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]]; then
            echo "Only run disk preparation on a disposable GitHub-hosted runner" >&2
            exit 1
          fi
          echo "Before preparation"
          df -h "$RUNNER_TEMP"
          # This specific Linux runner is dedicated to Android Chromium.
          # Remove only the unrelated preinstalled toolchains, not SDK or user files.
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Chromium sync uses its own pinned NDK. Keep the runner build-tools
          # for aapt/apksigner and do not remove the whole Android installation.
          if [[ "$ANDROID_HOME" == /usr/local/lib/android/sdk ]]; then
            sudo rm -rf -- "$ANDROID_HOME/ndk"
          fi
          echo "After preparation"
          df -h "$RUNNER_TEMP"
          python3 tools/kiwi.py preflight "$RUNNER_TEMP"
      - name: Verify and prepare official sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/kiwi.py verify --role heritage
          tools="$RUNNER_TEMP/depot_tools"
          git init -q "$tools"
          git -C "$tools" fetch --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_REVISION"
          git -C "$tools" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$tools" rev-parse HEAD)" == "$DEPOT_TOOLS_REVISION" ]]
          # With DEPOT_TOOLS_UPDATE=0, gclient skips both the git update and
          # its normal bundled Python setup. Run only the pinned bootstrap.
          (
            cd "$tools"
            base_dir="$tools"
            set +u # The upstream shell bootstrap uses optional environment variables.
            source ./cipd_bin_setup.sh
            cipd_bin_setup
            source ./bootstrap_python3
            bootstrap_python3
          )
          [[ -s "$tools/python3_bin_reldir.txt" ]]
          [[ "$(git -C "$tools" rev-parse HEAD)" == "$DEPOT_TOOLS_REVISION" ]]
          echo "$tools" >> "$GITHUB_PATH"
      - name: Sync pinned Chromium Android source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -er '.sources[] | select(.role=="candidate") | .commit' sources.lock.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          mkdir "$RUNNER_TEMP/chromium"
          cd "$RUNNER_TEMP/chromium"
          gclient config --name src --unmanaged https://chromium.googlesource.com/chromium/src.git
          printf "\ntarget_os = ['android']\n" >> .gclient
          gclient sync --nohooks --no-history --revision "src@$sha"
          python3 "$GITHUB_WORKSPACE/tools/kiwi.py" verify-checkout src
          df -h .
      - name: Install pinned Android dependencies and generate GN
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          build/install-build-deps.sh --android --no-prompt
          gclient runhooks
          python3 "$GITHUB_WORKSPACE/tools/kiwi.py" prepare "$PWD" x64

          sudo apt-get install --no-install-recommends -y ccache
          /usr/bin/ccache --version
          cat >> out/kiwinext-x64/args.gn <<'GN_ARGS'
          use_siso = false
          # Test-only: isolate libc++ Clang header-module compilation cost.
          use_clang_modules = false
          cc_wrapper = "/usr/bin/ccache"
          GN_ARGS
          gn gen out/kiwinext-x64 --fail-on-unused-args
      - name: Restore this exact compiler cache
        id: compiler-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.temp }}/kiwi-checkpoint
          key: ${{ env.ORIGINAL_CACHE }}
          fail-on-cache-miss: true
      - name: Build the APK from the verified browser-generation checkpoint
        id: build
        if: steps.compiler-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          out=out/kiwinext-x64
          exchange="$RUNNER_TEMP/kiwi-checkpoint"
          export CCACHE_DIR="$RUNNER_TEMP/kiwi-ccache"
          export CCACHE_MAXSIZE=4Gi
          export CCACHE_COMPILERCHECK=content
          export CCACHE_CONFIGPATH=/dev/null
          mkdir "$CCACHE_DIR"
          [[ ! -e "$out/.ninja_log" ]]
          metric() { awk -v key="$1" '$1 == key {print $2}' "$2"; }
          fingerprint() {
            printf '%s\n' "$(pwd -P)" "${ImageVersion:?}" "$(git rev-parse HEAD)" "$DEPOT_TOOLS_REVISION" "$(sha256sum "$out/args.gn")"
            /usr/bin/ccache --version
          }
          fingerprint | cmp - "$exchange/inputs.txt"
          (cd "$exchange" && sha256sum -c SHA256SUMS)
          zstd -qdc "$exchange/ccache.tar.zst" | tar -xf - -C "$CCACHE_DIR" --no-same-owner
          /usr/bin/ccache --zero-stats
          log="$RUNNER_TEMP/kiwi-ccache-build.log"
          start=$SECONDS
          (
            sleeper=
            trap 'if [[ -n "$sleeper" ]]; then kill "$sleeper" 2>/dev/null || true; fi; exit 0' TERM
            while true; do
              sleep 600 &
              sleeper=$!
              wait "$sleeper" || exit 0
              sleeper=
              printf 'Build heartbeat at %s\n' "$(date -u +%FT%TZ)"
              tail -n 3 "$log"
              df -h .
            done
          ) &
          reporter=$!
          trap 'kill "$reporter" 2>/dev/null || true' EXIT
          rc=0
          timeout --signal=INT --kill-after=30s 300m autoninja -C "$out" chrome_public_apk > "$log" 2>&1 || rc=$?
          elapsed=$((SECONDS-start))
          kill "$reporter" 2>/dev/null || true
          wait "$reporter" 2>/dev/null || true
          trap - EXIT
          tail -n 40 "$log"
          df -h .
          if (( rc == 0 )); then
            test -s "$out/apks/ChromePublic.apk"
            /usr/bin/ccache --show-stats --verbose
            echo 'outcome=apk' >> "$GITHUB_OUTPUT"
            printf 'APK compiled in %ss; package verification follows.\n' "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( rc != 124 )) || ! grep -Fq "interrupted by user" "$log"; then
            echo "::error::APK build failed, rather than reaching the planned cutoff (exit $rc)"
            exit 1
          fi
          echo 'outcome=partial' >> "$GITHUB_OUTPUT"
          test -s "$out/.ninja_log"
          stats="$RUNNER_TEMP/ccache-stats.tsv"
          /usr/bin/ccache --print-stats > "$stats"
          /usr/bin/ccache --show-stats --verbose
          misses="$(metric cache_miss "$stats")"
          direct="$(metric direct_cache_hit "$stats")"
          preprocessed="$(metric preprocessed_cache_hit "$stats")"
          [[ "$misses" =~ ^[0-9]+$ && "$direct" =~ ^[0-9]+$ && "$preprocessed" =~ ^[0-9]+$ ]]
          prior="$(cat "$exchange/seed-misses.txt")"
          [[ "$prior" =~ ^[0-9]+$ ]] && (( prior >= 100 ))
          hits=$((direct + preprocessed))
          read -r bytes _ < <(du -sb "$CCACHE_DIR")
          printf 'Restore: %s compiler hits, %s misses in %ss (previous runner candidate compiler calls: %s); cache now %s bytes.\n' "$hits" "$misses" "$elapsed" "$prior" "$bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/tools/compare_ninja_progress.py" \
            "$exchange/seed.ninja_log" "$out/.ninja_log" | tee -a "$GITHUB_STEP_SUMMARY"
          (( hits * 4 >= prior * 3 )) || {
            echo "::error::Extended runner did not reproduce enough compiler calls of the previous stage"
            exit 1
          }
      - name: Reject a non-exact cache result
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: exit 1
      - name: Verify package identity, ABI, signature and digest
        if: steps.build.outputs.outcome == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          apk="$PWD/out/kiwinext-x64/apks/ChromePublic.apk"
          test -s "$apk"
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          "$sdk_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-details.txt"
          grep -F "package: name='io.github.ktclat.kiwinext.dev'" "$RUNNER_TEMP/apk-details.txt"
          grep -F "native-code: 'x86_64'" "$RUNNER_TEMP/apk-details.txt"
          "$sdk_tools/apksigner" verify --print-certs "$apk" >> "$RUNNER_TEMP/apk-details.txt"
          grep -Fx "Signer #1 certificate SHA-256 digest: 32a2fc74d731105859e5a85df16d95f102d85b22099b8064c5d8915c61dad1e0" "$RUNNER_TEMP/apk-details.txt"
          stage="$RUNNER_TEMP/kiwi-engine-qa"
          mkdir "$stage"
          cp "$apk" "$stage/kiwinext-x64-dev.apk"
          cp "$RUNNER_TEMP/apk-details.txt" "$stage/"
          git rev-parse HEAD > "$stage/chromium-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$stage/kiwi-workflow-commit.txt"
          cp out/kiwinext-x64/args.gn "$stage/build-args.gn"
          printf '%s\n' "$DEPOT_TOOLS_REVISION" > "$stage/depot-tools-commit.txt"
          (cd "$stage" && sha256sum kiwinext-x64-dev.apk > SHA256SUMS.txt)
      - name: Upload verified engineering APK for emulator testing only
        if: steps.build.outputs.outcome == 'apk'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x64-engine-feasibility-only
          path: ${{ runner.temp }}/kiwi-engine-qa/
          if-no-files-found: error
          retention-days: 7
      - name: Pack the verified compiler cache and new progress
        if: steps.build.outputs.outcome == 'partial'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          out=out/kiwinext-x64
          exchange="$RUNNER_TEMP/kiwi-checkpoint"
          cache="$RUNNER_TEMP/kiwi-ccache"
          read -r bytes _ < <(du -sb "$cache")
          (( bytes > 10000 && bytes <= 4352 * 1024 * 1024 ))
          compiled="$(awk '$1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" {sum += $2} END {print sum+0}' "$RUNNER_TEMP/ccache-stats.tsv")"
          [[ "$compiled" =~ ^[0-9]+$ ]] && (( compiled >= 100 ))
          tar --format=posix -C "$cache" -cf - . | zstd -q -T2 -3 -o "$exchange/ccache.next.tar.zst"
          compressed="$(stat -c %s "$exchange/ccache.next.tar.zst")"
          (( compressed <= 4352 * 1024 * 1024 ))
          mv -- "$exchange/ccache.next.tar.zst" "$exchange/ccache.tar.zst"
          cp -- "$out/.ninja_log" "$exchange/seed.ninja_log"
          printf '%s\n' "$compiled" > "$exchange/seed-misses.txt"
          (cd "$exchange" && sha256sum ccache.tar.zst seed.ninja_log inputs.txt seed-misses.txt > SHA256SUMS)
          printf 'Forwarding %s compiler results/hits as candidate entries; archive %s bytes.\n' "$compiled" "$compressed"
      - name: Check repository cache headroom before saving
        if: steps.build.outputs.outcome == 'partial'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fail closed for a partial save. A finished APK never depends on cache quota.
          usage="$(curl --fail --silent --show-error --retry 2 --retry-delay 4 --max-time 15 \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/cache/usage")"
          used="$(jq -er --arg repo "$GITHUB_REPOSITORY" \
            'select(.full_name == $repo) | .active_caches_size_in_bytes | select(type == "number" and . >= 0)' <<<"$usage")"
          [[ "$used" =~ ^[0-9]{1,12}$ ]]
          read -r packed _ < <(du -sb "$RUNNER_TEMP/kiwi-checkpoint")
          printf 'Reported repository cache: %s bytes; pending archive and metadata: %s bytes.\n' "$used" "$packed"
          # Leave 500 MB for metering delay and transport overhead below 10 GB.
          (( used + packed <= 9500000000 )) || {
            echo "::error::Saving the new checkpoint could exceed the free cache allowance"
            exit 1
          }
      - name: Save bounded compiler cache for the next runner
        if: steps.build.outputs.outcome == 'partial'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.temp }}/kiwi-checkpoint
          key: ${{ env.CHAIN_CACHE }}
