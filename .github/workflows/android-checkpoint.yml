name: Kiwi Android Siso action-cache probe

on:
  push:
    branches: [test/android-checkpoint]
    paths: ['.github/workflows/android-checkpoint.yml']

permissions:
  contents: read

concurrency:
  group: kiwi-android-checkpoint
  cancel-in-progress: false

env:
  DEPOT_TOOLS_UPDATE: '0'
  DEPOT_TOOLS_REVISION: ac31fc680158b9ad57e4020e53943a6abd85fcd7
  CHECKPOINT_KEY: kiwi-siso-action-v1-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  seed:
    if: github.repository == 'Ktclat/kiwi-next' && github.ref == 'refs/heads/test/android-checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check capacity on a disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]]; then
            echo "Only run disk preparation on a disposable GitHub-hosted runner" >&2
            exit 1
          fi
          echo "Before preparation"
          df -h "$RUNNER_TEMP"
          # This specific Linux runner is dedicated to Android Chromium.
          # Remove only the unrelated preinstalled toolchains, not SDK or user files.
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Chromium sync uses its own pinned NDK. Keep the runner build-tools
          # for aapt/apksigner and do not remove the whole Android installation.
          if [[ "$ANDROID_HOME" == /usr/local/lib/android/sdk ]]; then
            sudo rm -rf -- "$ANDROID_HOME/ndk"
          fi
          echo "After preparation"
          df -h "$RUNNER_TEMP"
          python3 tools/kiwi.py preflight "$RUNNER_TEMP"
      - name: Verify and prepare official sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/kiwi.py verify --role heritage
          tools="$RUNNER_TEMP/depot_tools"
          git init -q "$tools"
          git -C "$tools" fetch --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_REVISION"
          git -C "$tools" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$tools" rev-parse HEAD)" == "$DEPOT_TOOLS_REVISION" ]]
          # With DEPOT_TOOLS_UPDATE=0, gclient skips both the git update and
          # its normal bundled Python setup. Run only the pinned bootstrap.
          (
            cd "$tools"
            base_dir="$tools"
            set +u # The upstream shell bootstrap uses optional environment variables.
            source ./cipd_bin_setup.sh
            cipd_bin_setup
            source ./bootstrap_python3
            bootstrap_python3
          )
          [[ -s "$tools/python3_bin_reldir.txt" ]]
          [[ "$(git -C "$tools" rev-parse HEAD)" == "$DEPOT_TOOLS_REVISION" ]]
          echo "$tools" >> "$GITHUB_PATH"
      - name: Sync pinned Chromium Android source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -er '.sources[] | select(.role=="candidate") | .commit' sources.lock.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          mkdir "$RUNNER_TEMP/chromium"
          cd "$RUNNER_TEMP/chromium"
          gclient config --name src --unmanaged https://chromium.googlesource.com/chromium/src.git
          printf "\ntarget_os = ['android']\n" >> .gclient
          gclient sync --nohooks --no-history --revision "src@$sha"
          python3 "$GITHUB_WORKSPACE/tools/kiwi.py" verify-checkout src
          df -h .
      - name: Install pinned Android dependencies and generate GN
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          build/install-build-deps.sh --android --no-prompt
          gclient runhooks
          python3 "$GITHUB_WORKSPACE/tools/kiwi.py" prepare "$PWD" x64
          gn gen out/kiwinext-x64 --fail-on-unused-args

      - name: Compile base from scratch and populate the action cache
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          out=out/kiwinext-x64
          cache="$RUNNER_TEMP/kiwi-siso-action-cache"
          exchange="$RUNNER_TEMP/kiwi-checkpoint"
          local_exec() { sed -nE 's/.*localexec\/[0-9]+[[:space:]]+([0-9]+)\(.*/\1/p' "$1" | tail -n1; }
          cache_hits() { sed -nE 's/^.*noexec:[0-9]+ local:[0-9]+ remote:[0-9]+ cache:([0-9]+) .*/\1/p' "$1" | tail -n1; }
          mkdir "$exchange" "$cache"
          [[ ! -e "$out/obj/base/libbase.a" ]]
          log="$RUNNER_TEMP/siso-seed.log"
          start=$SECONDS
          if timeout --kill-after=30s 35m siso ninja -C "$out" -local_cache_enable -cache_dir "$cache" -re_cache_enable_read=false -re_cache_enable_write=false base:base > "$log" 2>&1; then
            tail -n 16 "$log"
          else
            rc=$?
            tail -n 60 "$log"
            exit "$rc"
          fi
          elapsed=$((SECONDS-start))
          local_count="$(local_exec "$log")"
          [[ "$local_count" =~ ^[0-9]+$ ]] && (( local_count > 100 ))
          test -s "$out/obj/base/libbase.a"
          read -r raw_bytes _ < <(du -sb "$cache")
          (( raw_bytes > 10000 && raw_bytes <= 1024 * 1024 * 1024 ))
          start=$SECONDS
          tar --format=posix -C "$cache" -cf - . | zstd -q -T2 -3 -o "$exchange/action-cache.tar.zst"
          bytes="$(stat -c %s "$exchange/action-cache.tar.zst")"
          printf 'Action cache: %s raw bytes, %s compressed bytes in %ss\n' "$raw_bytes" "$bytes" "$((SECONDS-start))"
          (( bytes <= 512 * 1024 * 1024 )) || { echo "Probe exceeded its 512 MiB transport budget"; exit 1; }
          printf '%s\n' "$(pwd -P)" "${ImageVersion:?}" "$(git rev-parse HEAD)" "$DEPOT_TOOLS_REVISION" "$(sha256sum "$out/args.gn")" > "$exchange/inputs.txt"
          printf '%s\n' "$local_count" > "$exchange/seed-local-execs.txt"
          (cd "$exchange" && sha256sum action-cache.tar.zst > SHA256SUMS)
          printf 'Seed: %s local subprocesses in %ss.\n' "$local_count" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
      - name: Save this run's bounded action cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.temp }}/kiwi-checkpoint
          key: ${{ env.CHECKPOINT_KEY }}
  restore:
    needs: seed
    if: github.repository == 'Ktclat/kiwi-next' && github.ref == 'refs/heads/test/android-checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check capacity on a disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]]; then
            echo "Only run disk preparation on a disposable GitHub-hosted runner" >&2
            exit 1
          fi
          echo "Before preparation"
          df -h "$RUNNER_TEMP"
          # This specific Linux runner is dedicated to Android Chromium.
          # Remove only the unrelated preinstalled toolchains, not SDK or user files.
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Chromium sync uses its own pinned NDK. Keep the runner build-tools
          # for aapt/apksigner and do not remove the whole Android installation.
          if [[ "$ANDROID_HOME" == /usr/local/lib/android/sdk ]]; then
            sudo rm -rf -- "$ANDROID_HOME/ndk"
          fi
          echo "After preparation"
          df -h "$RUNNER_TEMP"
          python3 tools/kiwi.py preflight "$RUNNER_TEMP"
      - name: Verify and prepare official sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/kiwi.py verify --role heritage
          tools="$RUNNER_TEMP/depot_tools"
          git init -q "$tools"
          git -C "$tools" fetch --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_REVISION"
          git -C "$tools" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$tools" rev-parse HEAD)" == "$DEPOT_TOOLS_REVISION" ]]
          # With DEPOT_TOOLS_UPDATE=0, gclient skips both the git update and
          # its normal bundled Python setup. Run only the pinned bootstrap.
          (
            cd "$tools"
            base_dir="$tools"
            set +u # The upstream shell bootstrap uses optional environment variables.
            source ./cipd_bin_setup.sh
            cipd_bin_setup
            source ./bootstrap_python3
            bootstrap_python3
          )
          [[ -s "$tools/python3_bin_reldir.txt" ]]
          [[ "$(git -C "$tools" rev-parse HEAD)" == "$DEPOT_TOOLS_REVISION" ]]
          echo "$tools" >> "$GITHUB_PATH"
      - name: Sync pinned Chromium Android source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -er '.sources[] | select(.role=="candidate") | .commit' sources.lock.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          mkdir "$RUNNER_TEMP/chromium"
          cd "$RUNNER_TEMP/chromium"
          gclient config --name src --unmanaged https://chromium.googlesource.com/chromium/src.git
          printf "\ntarget_os = ['android']\n" >> .gclient
          gclient sync --nohooks --no-history --revision "src@$sha"
          python3 "$GITHUB_WORKSPACE/tools/kiwi.py" verify-checkout src
          df -h .
      - name: Install pinned Android dependencies and generate GN
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chromium/src"
          build/install-build-deps.sh --android --no-prompt
          gclient runhooks
          python3 "$GITHUB_WORKSPACE/tools/kiwi.py" prepare "$PWD" x64

          gn gen out/kiwinext-x64 --fail-on-unused-args
      - name: Restore this run's action cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cache
        with:
          path: ${{ runner.temp }}/kiwi-checkpoint
          key: ${{ env.CHECKPOINT_KEY }}
          fail-on-cache-miss: true
      - name: Check for actual action-cache hits from clean output
        shell: bash
        env:
          EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [[ "$EXACT_HIT" == true ]]
          cd "$RUNNER_TEMP/chromium/src"
          out=out/kiwinext-x64
          cache="$RUNNER_TEMP/kiwi-siso-action-cache"
          exchange="$RUNNER_TEMP/kiwi-checkpoint"
          local_exec() { sed -nE 's/.*localexec\/[0-9]+[[:space:]]+([0-9]+)\(.*/\1/p' "$1" | tail -n1; }
          cache_hits() { sed -nE 's/^.*noexec:[0-9]+ local:[0-9]+ remote:[0-9]+ cache:([0-9]+) .*/\1/p' "$1" | tail -n1; }
          printf '%s\n' "$(pwd -P)" "${ImageVersion:?}" "$(git rev-parse HEAD)" "$DEPOT_TOOLS_REVISION" "$(sha256sum "$out/args.gn")" | cmp - "$exchange/inputs.txt"
          (cd "$exchange" && sha256sum -c SHA256SUMS)
          mkdir "$cache"
          zstd -qdc "$exchange/action-cache.tar.zst" | tar -xf - -C "$cache" --no-same-owner
          [[ ! -e "$out/obj/base/libbase.a" ]]
          log="$RUNNER_TEMP/siso-restore.log"
          start=$SECONDS
          if timeout --kill-after=30s 35m siso ninja -C "$out" -local_cache_enable -cache_dir "$cache" -re_cache_enable_read=false -re_cache_enable_write=false base:base > "$log" 2>&1; then
            tail -n 16 "$log"
          else
            rc=$?
            tail -n 60 "$log"
            exit "$rc"
          fi
          elapsed=$((SECONDS-start))
          test -s "$out/obj/base/libbase.a"
          seed_count="$(cat "$exchange/seed-local-execs.txt")"
          local_count="$(local_exec "$log")"
          hits="$(cache_hits "$log")"
          printf 'Seed %s local executions; restore %s executions, %s action-cache hits in %ss.\n' \
            "$seed_count" "$local_count" "$hits" "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$seed_count" =~ ^[0-9]+$ && "$local_count" =~ ^[0-9]+$ && "$hits" =~ ^[0-9]+$ ]]
          (( hits > 0 && local_count * 5 <= seed_count * 4 )) || {
            echo "::error::No demonstrated 20% reduction in local subprocesses"
            exit 1
          }
